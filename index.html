<html lang="ru">
<head>
<meta charset="utf-8">

<title>Создание документов</title>
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<style>
:root{--ink:#000;--soft:#6e6e6e;--blue:#2f6de0;--deep:#1c4db4;--light:#8fb0f0;--tint:#edf2fd;--line:#dbe4f8;--bar:#f7f8fb;--white:#fff;--red:#2f6de0;--ok:#1f8a4c;
box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Arial,'Helvetica Neue',Helvetica,'Liberation Sans',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;margin-bottom:24px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px;position:sticky;top:0;background:#fff;z-index:30}
.logo{font-size:1.25rem;font-weight:700}.logo b{color:var(--blue)}
.mono{font-size:.82rem;color:var(--soft)}
h2.t{font-size:clamp(2rem,6vw,2.6rem);margin:6px 0 4px;line-height:1.12;letter-spacing:-.01em;position:relative;width:fit-content;padding-bottom:.7em}
h2.t svg{position:absolute;left:.1em;bottom:.15em;width:6em;height:.34em;overflow:visible}
h2.t path{fill:none;stroke:var(--blue);stroke-width:.18em;stroke-linecap:round;vector-effect:non-scaling-stroke}
.lab{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.04em;margin:30px 0 14px}
.lab:before{content:"";width:22px;height:3px;background:var(--blue)}
.btn{background:#fff;color:var(--deep);border:3px solid var(--line);padding:10px 16px;font:700 .9rem Arial,sans-serif;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--blue)}
.btn.red{background:var(--blue);border-color:var(--blue);color:#fff}.btn.red:hover{background:var(--deep);border-color:var(--deep)}
.btn.dark{background:var(--tint);color:var(--blue)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-width:2px}
.btn[disabled]{opacity:.5;pointer-events:none}
.new{width:100%;max-width:300px;height:120px;border:3px dashed var(--line);background:var(--tint);display:flex;align-items:center;justify-content:center;font:700 1.05rem Arial,sans-serif;cursor:pointer;color:var(--blue);transition:border-color .15s}
.new:hover{border-color:var(--blue)}
.row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile,.doc,.card{background:#fff;border:3px solid var(--line);padding:20px;color:var(--ink);text-align:left;font:inherit;transition:border-color .15s}
.tile{cursor:pointer}.tile:hover,.doc:hover{border-color:var(--blue)}
.tile b{display:block;font-size:1.3rem;margin-bottom:6px}.tile span{font-size:.9rem;color:var(--soft)}
.doc{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.doc small{color:var(--soft)}
.hint{color:var(--soft);max-width:440px;font-size:1.05rem}
.hide{display:none!important}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tabs{display:flex;border:3px solid var(--line);flex:1;min-width:260px;max-width:520px}
.tab{flex:1;background:#fff;border:0;padding:12px 6px;font:700 .85rem Arial,sans-serif;cursor:pointer;color:var(--deep)}
.tab.on{background:var(--blue);color:#fff}
.cols{display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:1000px){.cols{grid-template-columns:minmax(380px,520px) 1fr;align-items:start}.tabs .t-prev{display:none}.tabs{max-width:300px}.pv{position:sticky;top:84px}}
.pane{display:none}.pane.on{display:block}
.card{margin-bottom:18px;padding:18px}
label.l{display:block;font-size:.8rem;color:var(--soft);margin:12px 0 4px}
input[type=text],input[type=number],textarea{width:100%;background:#fff;color:var(--ink);border:2px solid var(--line);padding:10px 12px;font:inherit;border-radius:0}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;align-items:center;gap:8px}.step input{width:76px;text-align:center}
.chk{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;color:var(--deep)}
.chk input{appearance:none;width:42px;height:24px;background:var(--line);position:relative;margin:0;cursor:pointer;border-radius:12px;transition:background .2s}
.chk input:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s}
.chk input:checked{background:var(--blue)}.chk input:checked:after{left:21px}
.sec{border:3px solid var(--line);background:var(--tint);padding:12px;margin-bottom:14px}
.sec .h{display:flex;gap:6px;margin-bottom:8px}.sec .h input{font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.imgs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.im{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);padding:6px}.im img{width:64px;height:48px;object-fit:cover}.im input{flex:1}
.note{display:flex;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}.note:last-child{border:0}
.note i{font-style:normal;font-weight:700;color:#d33}.note.ok i{color:var(--ok)}
.links a{color:var(--blue);font-weight:700;margin-right:14px;font-size:.95rem}
.stage{background:var(--tint);border:3px solid var(--line);padding:14px;overflow:auto}
.pw{position:relative;margin:0 auto 16px;box-shadow:0 2px 14px rgba(28,77,180,.18)}
.page{position:absolute;left:0;top:0;width:794px;height:1123px;background:#fff;color:#000;transform-origin:0 0;font-family:'Times New Roman',Tinos,'Liberation Serif',serif;font-size:18.67px;line-height:28px}
.pc{position:absolute;left:113px;top:76px;width:643px;height:971px;overflow:hidden}
.pc p{margin:0;text-align:justify;text-indent:47px}.pc p.cont{text-indent:0}
.pc .hd{font-weight:700;text-align:center;text-transform:uppercase;margin:0 0 18px}
.pc .fig{text-align:center;margin:8px 0 0}.pc .fig img{max-width:80%;max-height:300px;display:block;margin:0 auto}
.pc .cap{text-align:center;margin-bottom:14px}
.num{position:absolute;bottom:40px;left:0;right:0;text-align:center}
.tp{position:absolute;left:113px;top:76px;width:643px;height:971px;text-align:center;display:flex;flex-direction:column}
.tp .sp{flex:1}.tp .r{margin-left:200px;text-align:left}.tp .t{font-weight:700;font-size:22px;text-transform:uppercase;margin:6px 0}
#meas{position:absolute;left:-9999px;top:0;visibility:hidden}
#ov{position:fixed;inset:0;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .25s both}
#ov .card{max-width:440px;width:100%;background:#fff}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ld{text-align:center;color:var(--deep)}.ld h3{margin:14px 0 4px;font-size:1.5rem}.ld p{margin:0;color:var(--soft)}
.ld svg{width:240px;height:160px;overflow:visible}
.paper{fill:#fff;stroke:var(--line);stroke-width:4}
.wl{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140}
.w1{animation:d1 3.6s infinite}.w2{animation:d2 3.6s infinite}.w3{animation:d3 3.6s infinite}
@keyframes d1{0%{stroke-dashoffset:140}25%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:140;opacity:0}}
@keyframes d2{0%,30%{stroke-dashoffset:140}55%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:140;opacity:0}}
@keyframes d3{0%,60%{stroke-dashoffset:140}85%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:140;opacity:0}}
.w1,.w2,.w3{opacity:1}
.pen{animation:pen 3.6s infinite}
@keyframes pen{0%{transform:translate(35px,48px)}25%{transform:translate(175px,48px)}30%{transform:translate(35px,78px)}55%{transform:translate(175px,78px)}60%{transform:translate(35px,108px)}85%,100%{transform:translate(135px,108px)}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 18px;font-size:.9rem;z-index:60;max-width:90%}
.ready{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.ready .btn{width:100%;max-width:760px;font-size:1.05rem;padding:14px}

.brand{line-height:1.15}.by{font-size:.75rem;color:#9a9a9a;font-weight:400}
.logo{color:#000}
.pc .hd{margin-bottom:18px}
.num{top:38px;bottom:auto;position:absolute;left:0;right:0;text-align:center}
.ready{gap:10px}.ready .btn.back{width:auto;flex:none;padding:14px 20px}.ready .btn.red{flex:1;max-width:none}
.menu{position:absolute;top:100%;left:0;z-index:20;background:#fff;border:3px solid var(--line);min-width:250px;margin-top:4px;box-shadow:0 6px 20px rgba(28,77,180,.18)}
.menu button{display:flex;justify-content:space-between;gap:16px;width:100%;background:#fff;border:0;padding:11px 14px;font:700 .9rem Arial,sans-serif;color:var(--ink);cursor:pointer;align-items:center}
.menu button:hover{background:var(--tint);color:var(--blue)}

.blk{background:#fff;border:2px solid var(--line);padding:10px;margin-top:10px}
.bh{display:flex;gap:8px;align-items:center}.bh b{color:var(--deep);white-space:nowrap}
.gw{overflow-x:auto;margin:8px 0}
.ge{border-collapse:collapse}.ge td{padding:0;border:1px solid var(--line)}.ge input{border:0;min-width:110px;padding:7px 8px}
.fpv{margin-top:8px;font:italic 1.1rem 'Times New Roman',serif;text-align:center;padding:8px;background:var(--tint)}
.fm{position:relative;text-align:center;margin:8px 0;font-style:italic}.fm .fn{position:absolute;right:0;top:0;font-style:normal}
.tcap{margin:6px 0 4px}
.pt{width:100%;border-collapse:collapse;font-size:16px;line-height:20px;margin-bottom:12px}
.pt th,.pt td{border:1px solid #000;padding:3px 6px;text-align:left;height:26px}.pt th{text-align:center;font-weight:700}
.fr{position:absolute;left:76px;top:19px;width:699px;height:1085px;border:2px solid #000;box-sizing:border-box}
.st{position:absolute;border:2px solid #000;box-sizing:border-box}
.sc{position:absolute;border-right:1px solid #000;border-bottom:1px solid #000;display:flex;align-items:center;justify-content:center;font:italic 10px/1.1 'Times New Roman',serif;text-align:center;overflow:hidden;box-sizing:border-box}
.sc.big{font:normal 13px/1.15 'Times New Roman',serif}

.sc span{display:block;min-width:100%;padding:0 2px;outline:none;cursor:text;word-break:break-word}.sc span:focus{background:#fff6c9}.sc span:hover{background:#eef3ff}
select{width:100%;border:3px solid var(--line);padding:10px;font:inherit;background:#fff;color:var(--ink)}
textarea.ai-t{width:100%;min-height:70px;border:3px solid var(--line);padding:8px;font:inherit}

.seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:6px 0 10px}
.opt{background:#fff;border:3px solid var(--line);padding:12px 14px;text-align:left;font:inherit;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.opt b{display:block;font-size:1rem;color:var(--deep)}.opt span{display:block;font-size:.8rem;color:var(--soft);margin-top:3px}
.opt:hover{border-color:var(--light)}.opt.on{border-color:var(--blue);background:var(--tint)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;background:var(--line);border-radius:4px;outline:none;margin:14px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 3px var(--blue);border-radius:50%;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 3px var(--blue);border-radius:50%;cursor:pointer}
.rl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--soft)}.rl b{color:var(--deep)}
.guide{background:var(--tint);border:2px solid var(--line);padding:12px 14px;margin:8px 0;font-size:.9rem}.guide ol{margin:6px 0 10px;padding-left:20px}.guide li{margin:4px 0}
#ov2,#ov3{position:fixed;inset:0;background:rgba(255,255,255,.97);display:flex;align-items:center;justify-content:center;padding:12px;z-index:55}#ov3{z-index:60;background:rgba(255,255,255,.6)}
#ov.dim{background:rgba(28,77,180,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#ov.dim .card{max-width:460px;box-shadow:0 12px 40px rgba(28,77,180,.28);margin:0;padding:22px}
#ov4{position:fixed;inset:0;background:rgba(28,77,180,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:56;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px}
#ov4 .in{max-width:520px;margin:0 auto;background:#fff;border:3px solid var(--line);padding:18px;box-shadow:0 12px 40px rgba(28,77,180,.28)}
#ov4 .in .card{margin-bottom:12px}
.dn{text-align:center}.dn .lab{justify-content:center}.dn .lab:before{display:none}
.dn .seg{grid-template-columns:1fr 1fr;margin:8px 0 14px}.dn .opt{text-align:center}
.sgbtn{width:100%;margin:0 0 6px;padding:14px;font-size:1rem}
.sgst{font-size:.85rem;color:var(--soft);margin-bottom:16px}.sgst.ok{color:var(--ok);font-weight:700}
.dn .fin{width:100%;font-size:1.05rem;padding:14px}
.dn .sec2{margin-top:10px;width:100%}
.edbox{overflow:auto;border:3px solid var(--line);background:#fff;padding:10px;max-width:100%;-webkit-overflow-scrolling:touch}.edbox .st{flex:none}.edbox .sc{background:#fff}.edbox .sc:hover{background:var(--tint)}

.sgw{margin-top:30px;text-indent:0}.sgd{text-align:left;margin-top:12px}
.sgr{display:flex;align-items:flex-end;gap:12px;margin-top:8px}.sgrl{flex:none;max-width:210px}

.litb{font-size:.85rem;color:var(--soft);margin-top:6px}
/* ---------- презентации ---------- */
.nrow{display:flex;gap:8px}.nrow .btn{min-width:48px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swb{width:84px;border:3px solid var(--line);background:#fff;padding:5px;cursor:pointer;font:700 .72rem Arial,sans-serif;color:var(--soft);text-align:center;transition:border-color .15s}

.pslide .hd2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;color:var(--deep)}
.pim{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.pim img{width:84px;height:56px;object-fit:cover;border:2px solid var(--line)}
